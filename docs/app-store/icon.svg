    <circle cx="900" cy="640" r="6"/><circle cx="300" cy="900" r="3"/><circle cx="760" cy="880" r="4"/>
    <circle cx="640" cy="120" r="3"/><circle cx="90" cy="460" r="3"/>
  </g>
  <circle cx="512" cy="512" r="300" fill="url(#glow)"/>
  <g fill="none" stroke="#eaf3f7" stroke-width="44" stroke-linecap="round" opacity="0.95">
    <circle cx="512" cy="512" r="300"/>
    <path d="M512 212v86M812 512h-86M512 812v-86M212 512h86"/>
