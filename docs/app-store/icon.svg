<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Fathom app icon: the depth gauge on deep water. Rendered to AppIcon-512@2x.png. -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4a5a"/>
      <stop offset="0.45" stop-color="#082a3a"/>
      <stop offset="1" stop-color="#030811"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe7e6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9fe7e6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
